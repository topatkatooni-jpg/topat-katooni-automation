name: Topat Katooni AI Product Albums

on:
  workflow_dispatch:

jobs:
  product-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and prompt files
        uses: actions/checkout@v4

      - name: Install image processing dependency
        run: python -m pip install --quiet Pillow

      - name: Extract product, generate image, and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import base64
          import random
          import urllib.request
          import urllib.parse
          import urllib.error
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation, ROUND_HALF_UP
          from io import BytesIO
          from PIL import Image

          BASE = "https://topatkatooni.ir"
          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          CF_TOKEN = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          CF_ACCOUNT = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()

          if not TOKEN or not CHAT_ID:
              raise SystemExit("ERROR: Telegram secrets are missing.")
          if not CF_TOKEN or not CF_ACCOUNT:
              raise SystemExit("ERROR: Cloudflare secrets are missing.")

          def fetch(url, timeout=45):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Chrome/130 Safari/537.36"
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read(), response.headers

          def fetch_text(url):
              data, _ = fetch(url)
              return data.decode("utf-8", errors="replace")

          def clean_text(value):
              if not value:
                  return ""
              value = html.unescape(str(value))
              value = re.sub(
                  r"<(script|style)\b.*?</\1>",
                  " ",
                  value,
                  flags=re.I | re.S,
              )
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def get_meta(page_html, prop):
              patterns = [
                  r'<meta[^>]+(?:property|name)=["\']'
                  + re.escape(prop)
                  + r'["\'][^>]+content=["\']([^"\']*)',
                  r'<meta[^>]+content=["\']([^"\']*)["\'][^>]+'
                  r'(?:property|name)=["\']'
                  + re.escape(prop)
                  + r'["\']',
              ]
              for pattern in patterns:
                  match = re.search(pattern, page_html, re.I | re.S)
                  if match:
                      return html.unescape(match.group(1)).strip()
              return ""

          def find_products(obj):
              if isinstance(obj, dict):
                  types = obj.get("@type", [])
                  if isinstance(types, str):
                      types = [types]
                  if "Product" in types:
                      yield obj
                  for value in obj.values():
                      yield from find_products(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from find_products(value)

          def extract_products(page_html):
              found = []
              pattern = (
                  r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>'
                  r'(.*?)</script>'
              )
              for match in re.finditer(pattern, page_html, re.I | re.S):
                  try:
                      found.extend(find_products(json.loads(match.group(1))))
                  except (json.JSONDecodeError, TypeError):
                      pass
              return found

          def get_product_urls():
              sitemap_url = BASE + "/product-sitemap.xml"
              root = ET.fromstring(fetch_text(sitemap_url))
              namespace = {
                  "sm": "http://www.sitemaps.org/schemas/sitemap/0.9"
              }

              urls = [
                  node.text.strip()
                  for node in root.findall(".//sm:url/sm:loc", namespace)
                  if node.text
              ]
              child_maps = [
                  node.text.strip()
                  for node in root.findall(".//sm:sitemap/sm:loc", namespace)
                  if node.text
              ]

              for child_map in child_maps:
                  child_root = ET.fromstring(fetch_text(child_map))
                  urls.extend(
                      node.text.strip()
                      for node in child_root.findall(".//sm:url/sm:loc", namespace)
                      if node.text
                  )

              host = urllib.parse.urlparse(BASE).netloc.lower()
              results = []
              for url in dict.fromkeys(urls):
                  parsed = urllib.parse.urlparse(url)
                  path = parsed.path.lower().rstrip("/")
                  if parsed.scheme not in ("http", "https"):
                      continue
                  if parsed.netloc.lower() != host:
                      continue
                  if any(
                      marker in path + "/"
                      for marker in (
                          "/product-category/",
                          "/product-tag/",
                          "/category/",
                          "/tag/",
                          "/page/",
                      )
                  ):
                      continue
                  if path in ("/shop", "/cart", "/checkout", "/my-account"):
                      continue
                  results.append(url)
              return results

          print("Step 1: Finding the first valid product.")
          product_url = None
          page = None
          product = None

          for candidate in get_product_urls()[:80]:
              try:
                  candidate_page = fetch_text(candidate)
                  products = extract_products(candidate_page)
                  if products:
                      product_url = candidate
                      page = candidate_page
                      product = products[0]
                      break
              except Exception as exc:
                  print(
                      "Skipping product page:",
                      type(exc).__name__,
                  )

          if not product_url or not product:
              raise SystemExit("ERROR: No valid product page was found.")

          title = clean_text(
              product.get("name")
              or get_meta(page, "og:title")
              or "محصول توپات کتونی"
          )
          description = clean_text(
              product.get("description")
              or get_meta(page, "og:description")
              or "برای مشاهده مشخصات کامل و شرایط خرید، صفحه محصول را ببینید."
          )

          # Extract image URLs from the product structured data.
          def image_values(value):
              if isinstance(value, str):
                  return [value]
              if isinstance(value, list):
                  result = []
                  for item in value:
                      result.extend(image_values(item))
                  return result
              if isinstance(value, dict):
                  result = []
                  for key in ("url", "contentUrl", "@id"):
                      if value.get(key):
                          result.extend(image_values(value[key]))
                  return result
              return []

          image_urls = []
          for value in image_values(product.get("image")):
              image_urls.append(
                  urllib.parse.urljoin(product_url, html.unescape(value))
              )

          og_image = get_meta(page, "og:image")
          if og_image:
              image_urls.append(
                  urllib.parse.urljoin(product_url, og_image)
              )

          # Look for full-size product gallery images.
          gallery_pattern = (
              r'<(?:img|source)\b[^>]*>'
          )
          for tag in re.findall(gallery_pattern, page, re.I | re.S):
              for attribute in (
                  "data-large_image",
                  "data-src",
                  "src",
              ):
                  match = re.search(
                      r'\b' + attribute + r'\s*=\s*["\']([^"\']+)["\']',
                      tag,
                      re.I | re.S,
                  )
                  if match:
                      image_urls.append(
                          urllib.parse.urljoin(
                              product_url,
                              html.unescape(match.group(1)),
                          )
                      )
                      break

          image_bytes = None
          image_headers = None
          seen = set()

          for image_url in image_urls:
              if image_url in seen:
                  continue
              seen.add(image_url)
              try:
                  candidate_bytes, candidate_headers = fetch(
                      image_url,
                      timeout=60,
                  )
                  content_type = candidate_headers.get(
                      "Content-Type", ""
                  ).split(";")[0].lower()
                  if (
                      content_type.startswith("image/")
                      and 0 < len(candidate_bytes) <= 10 * 1024 * 1024
                  ):
                      image_bytes = candidate_bytes
                      image_headers = candidate_headers
                      print("Downloaded product image:", image_url)
                      break
              except Exception as exc:
                  print("Image download failed:", type(exc).__name__)

          if image_bytes is None:
              raise SystemExit("ERROR: Could not download a product image.")

          print("Product title:", title)

          # Read price from the product schema.
          offers = product.get("offers", {})
          if isinstance(offers, list):
              offers = offers[0] if offers else {}
          if isinstance(offers, dict) and isinstance(offers.get("offers"), list):
              offers = offers["offers"][0] if offers["offers"] else {}

          raw_price = offers.get("price") if isinstance(offers, dict) else None
          currency = (
              offers.get("priceCurrency", "").upper()
              if isinstance(offers, dict)
              else ""
          )

          price = None
          if raw_price is not None:
              try:
                  price = Decimal(str(raw_price))
              except InvalidOperation:
                  pass

          toman_price = None
          if price is not None:
              if currency == "IRR":
                  toman_price = price / Decimal("10")
              elif currency in ("IRT", "TMN", "TOM", "TOMAN"):
                  toman_price = price

          def format_amount(value):
              rounded = value.quantize(
                  Decimal("1"),
                  rounding=ROUND_HALF_UP,
              )
              return f"{int(rounded):,}".replace(",", "٬")

          caption_parts = [title]

          if toman_price is not None:
              installment = toman_price / Decimal("4")
              caption_parts.append(
                  "💰 قیمت محصول: "
                  + format_amount(toman_price)
                  + " تومان"
              )
              caption_parts.append(
                  "🛍 خرید در ۴ قسط: "
                  + format_amount(installment)
                  + " تومان / هر قسط"
              )
          else:
              caption_parts.append(
                  "💰 برای اطلاع از قیمت و شرایط پرداخت، صفحه محصول را ببینید."
              )

          caption_parts.append(
              "📋 معرفی محصول\n"
              + (
                  description[:500]
                  if description
                  else "برای مشاهده مشخصات کامل محصول، وارد صفحه آن شوید."
              )
          )
          link_block = "🔗 مشاهده محصول و خرید آنلاین:\n" + product_url
          caption_parts.append(link_block)
          caption = "\n\n".join(caption_parts)

          # Telegram photo captions have a 1024-character limit.
          if len(caption) > 1000:
              caption_parts = caption_parts[:-2] + [
                  "📋 معرفی محصول",
                  link_block,
              ]
              caption = "\n\n".join(caption_parts)

          print("Step 2: Preparing the reference image.")
          with Image.open(BytesIO(image_bytes)) as source:
              source = source.convert("RGB")
              source.thumbnail((480, 480), Image.Resampling.LANCZOS)
              buffer = BytesIO()
              source.save(buffer, format="JPEG", quality=88, optimize=True)
              reference_bytes = buffer.getvalue()

          prompt_path = "prompts/lifestyle/01-urban-street.txt"
          if not os.path.isfile(prompt_path):
              raise SystemExit(
                  "ERROR: Missing prompt file: " + prompt_path
              )

          with open(prompt_path, "r", encoding="utf-8") as prompt_file:
              prompt = prompt_file.read().strip()

          if not prompt:
              raise SystemExit("ERROR: The prompt file is empty.")

          print("Step 3: Requesting one AI lifestyle image from Cloudflare.")

          model_url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + CF_ACCOUNT
              + "/ai/run/@cf/black-forest-labs/flux-2-klein-4b"
          )

          boundary = "----TopatCloudflareBoundary" + str(
              random.randint(100000, 999999)
          )
          request_body = bytearray()

          def cf_field(name, value):
              request_body.extend(("--" + boundary + "\r\n").encode())
              request_body.extend(
                  (
                      'Content-Disposition: form-data; name="'
                      + name
                      + '"\r\n\r\n'
                  ).encode()
              )
              request_body.extend(str(value).encode("utf-8"))
              request_body.extend(b"\r\n")

          cf_field("prompt", prompt)
          cf_field("width", "1024")
          cf_field("height", "1024")

          request_body.extend(("--" + boundary + "\r\n").encode())
          request_body.extend(
              (
                  'Content-Disposition: form-data; name="input_image_0"; '
                  'filename="reference.jpg"\r\n'
                  "Content-Type: image/jpeg\r\n\r\n"
              ).encode()
          )
          request_body.extend(reference_bytes)
          request_body.extend(b"\r\n--" + boundary.encode() + b"--\r\n")

          cf_request = urllib.request.Request(
              model_url,
              data=bytes(request_body),
              headers={
                  "Authorization": "Bearer " + CF_TOKEN,
                  "Content-Type": "multipart/form-data; boundary=" + boundary,
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  cf_request,
                  timeout=180,
              ) as response:
                  response_data = json.loads(
                      response.read().decode("utf-8")
                  )
          except urllib.error.HTTPError as exc:
              details = exc.read().decode("utf-8", errors="replace")
              print("Cloudflare HTTP status:", exc.code)
              print("Cloudflare response:", details[:2000])
              raise SystemExit(
                  "ERROR: Cloudflare did not generate the image."
              )

          result_data = response_data.get("result") or {}
          encoded_image = result_data.get("image")
          if not encoded_image:
              print("Cloudflare response:", str(response_data)[:2000])
              raise SystemExit(
                  "ERROR: Cloudflare response did not include result.image."
              )

          try:
              generated_bytes = base64.b64decode(encoded_image)
              with Image.open(BytesIO(generated_bytes)) as generated:
                  generated = generated.convert("RGB")
                  output_buffer = BytesIO()
                  generated.save(
                      output_buffer,
                      format="JPEG",
                      quality=92,
                      optimize=True,
                  )
                  final_image = output_buffer.getvalue()
          except Exception as exc:
              raise SystemExit(
                  "ERROR: Could not decode the generated image: "
                  + type(exc).__name__
              )

          print("AI image generated successfully.")

          print("Step 4: Sending the AI image and caption to Telegram.")
          boundary = "----TopatKatooniTelegramBoundary"
          body = bytearray()

          def add_field(name, value):
              body.extend(("--" + boundary + "\r\n").encode())
              body.extend(
                  (
                      'Content-Disposition: form-data; name="'
                      + name
                      + '"\r\n\r\n'
                  ).encode()
              )
              body.extend(str(value).encode("utf-8"))
              body.extend(b"\r\n")

          add_field("chat_id", CHAT_ID)
          add_field("caption", caption)

          body.extend(("--" + boundary + "\r\n").encode())
          body.extend(
              (
                  'Content-Disposition: form-data; name="photo"; '
                  'filename="topat-urban-lifestyle.jpg"\r\n'
                  "Content-Type: image/jpeg\r\n\r\n"
              ).encode()
          )
          body.extend(final_image)
          body.extend(b"\r\n--" + boundary.encode() + b"--\r\n")

          telegram_url = (
              "https://api.telegram.org/bot"
              + TOKEN
              + "/sendPhoto"
          )
          telegram_request = urllib.request.Request(
              telegram_url,
              data=bytes(body),
              headers={
                  "Content-Type": "multipart/form-data; boundary=" + boundary
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  telegram_request,
                  timeout=120,
              ) as response:
                  telegram_result = json.loads(
                      response.read().decode("utf-8")
                  )
          except urllib.error.HTTPError as exc:
              details = exc.read().decode("utf-8", errors="replace")
              print("Telegram HTTP status:", exc.code)
              print("Telegram response:", details[:1000])
              raise SystemExit("ERROR: Telegram upload failed.")

          if not telegram_result.get("ok"):
              print("Telegram API response:", str(telegram_result)[:1000])
              raise SystemExit("ERROR: Telegram did not confirm the send.")

          print("SUCCESS: AI lifestyle image and product caption sent.")
          print("Product URL:", product_url)
          PY
