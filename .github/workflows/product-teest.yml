
name: Topat Katooni Product Test

on:
  workflow_dispatch:

jobs:
  product-test:
    runs-on: ubuntu-latest
    steps:
      - name: Extract product and send photo to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import urllib.request
          import urllib.parse
          import urllib.error
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation

          BASE = "https://topatkatooni.ir"
          SITEMAP = BASE + "/product-sitemap.xml"
          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"].strip()

          if not TOKEN or not CHAT_ID:
              raise SystemExit("ERROR: Telegram secrets are missing.")

          def fetch(url, timeout=30):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read(), response.headers

          def fetch_text(url):
              data, _ = fetch(url)
              return data.decode("utf-8", errors="replace")

          print("Step 1: Reading product sitemap.")
          root = ET.fromstring(fetch_text(SITEMAP))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          product_urls = [
              node.text.strip()
              for node in root.findall(".//sm:url/sm:loc", ns)
              if node.text
          ]

          # Also support a sitemap index, if this file contains child sitemaps.
          child_maps = [
              node.text.strip()
              for node in root.findall(".//sm:sitemap/sm:loc", ns)
              if node.text
          ]

          for child_map in child_maps:
              child_root = ET.fromstring(fetch_text(child_map))
              product_urls.extend(
                  node.text.strip()
                  for node in child_root.findall(".//sm:url/sm:loc", ns)
                  if node.text
              )

          product_urls = list(dict.fromkeys(product_urls))
          product_urls = [
              url for url in product_urls
              if urllib.parse.urlparse(url).netloc.lower()
              == urllib.parse.urlparse(BASE).netloc.lower()
          ]

          print("Product URLs found:", len(product_urls))

          if not product_urls:
              raise SystemExit("ERROR: No product URLs found.")

          # Send only one product during this test.
          product_url = product_urls[0]
          print("Selected product URL:", product_url)

          print("Step 2: Extracting product details.")
          page = fetch_text(product_url)

          def get_meta(prop):
              patterns = [
                  r'<meta[^>]+property=["\']' + re.escape(prop) +
                  r'["\'][^>]+content=["\']([^"\']*)',
                  r'<meta[^>]+content=["\']([^"\']*)' +
                  r'["\'][^>]+property=["\']' + re.escape(prop) + r'["\']'
              ]
              for pattern in patterns:
                  match = re.search(pattern, page, re.I)
                  if match:
                      return html.unescape(match.group(1)).strip()
              return None

          def find_products(obj):
              if isinstance(obj, dict):
                  typ = obj.get("@type", [])
                  if isinstance(typ, str):
                      typ = [typ]
                  if "Product" in typ:
                      yield obj
                  for value in obj.values():
                      yield from find_products(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from find_products(value)

          products = []
          json_ld_pattern = (
              r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>'
              r'(.*?)</script>'
          )

          for match in re.finditer(json_ld_pattern, page, re.I | re.S):
              try:
                  products.extend(find_products(json.loads(match.group(1))))
              except (json.JSONDecodeError, TypeError):
                  pass

          product = products[0] if products else {}

          title = (
              product.get("name")
              or get_meta("og:title")
              or "محصول توپات کتونی"
          )

          description = (
              product.get("description")
              or get_meta("og:description")
              or "برای مشاهده مشخصات کامل به صفحه محصول مراجعه کنید."
          )
          description = re.sub(r"<[^>]+>", "", html.unescape(description))
          description = re.sub(r"\s+", " ", description).strip()

          image = product.get("image") or get_meta("og:image")
          if isinstance(image, list):
              image = image[0] if image else None
          if isinstance(image, dict):
              image = image.get("url") or image.get("contentUrl")
          if image:
              image = urllib.parse.urljoin(product_url, image)

          offers = product.get("offers", {})
          if isinstance(offers, list):
              offers = offers[0] if offers else {}
          if isinstance(offers, dict) and isinstance(offers.get("offers"), list):
              offers = offers["offers"][0] if offers["offers"] else {}

          raw_price = offers.get("price") if isinstance(offers, dict) else None
          currency = (
              offers.get("priceCurrency", "")
              if isinstance(offers, dict) else ""
          )

          price = None
          if raw_price is not None:
              try:
                  price = Decimal(str(raw_price))
              except InvalidOperation:
                  pass

          print("Product title:", title)
          print("Product description found:", bool(description))
          print("Product image found:", bool(image))
          print("Product price found:", price is not None)

          if price is not None:
              installment = price / Decimal("4")
              print("Price currency from site:", currency or "not specified")
              print("Product price:", price)
              print("Each installment (price / 4):", installment)
          else:
              installment = None
              print("WARNING: Price was not found in structured product data.")

          if not image:
              raise SystemExit("ERROR: Product image was not found.")

          print("Step 3: Downloading image.")
          image_bytes, image_headers = fetch(image, timeout=60)
          if not image_bytes:
              raise SystemExit("ERROR: Image download returned no data.")
          if len(image_bytes) > 10 * 1024 * 1024:
              raise SystemExit("ERROR: Image exceeds Telegram photo limit.")

          content_type = image_headers.get("Content-Type", "").split(";")[0]
          if not content_type.startswith("image/"):
              raise SystemExit("ERROR: Image URL did not return an image.")

          extension = {
              "image/jpeg": "jpg",
              "image/png": "png",
              "image/webp": "webp"
          }.get(content_type, "jpg")

          caption_parts = [title]
          if price is not None:
              caption_parts.append("قیمت درج‌شده در سایت: " + str(price) + (
                  " " + currency if currency else ""
              ))
              caption_parts.append(
                  "قیمت هر قسط (۴ قسط): " + str(installment) + (
                      " " + currency if currency else ""
                  )
              )
          else:
              caption_parts.append(
                  "قیمت و اقساط را در صفحه محصول بررسی کنید."
              )
          caption_parts.append(description[:350])
          caption_parts.append(product_url)
          caption = "\n\n".join(caption_parts)[:1000]

          print("Step 4: Uploading image to Telegram Chat ID.")
          boundary = "----TopatKatooniBoundary"
          body = bytearray()

          def add_field(name, value):
              body.extend(("--" + boundary + "\r\n").encode())
              body.extend((
                  'Content-Disposition: form-data; name="' +
                  name + '"\r\n\r\n'
              ).encode())
              body.extend(str(value).encode("utf-8"))
              body.extend(b"\r\n")

          # IMPORTANT: Explicitly set the destination Telegram chat.
          add_field("chat_id", CHAT_ID)
          add_field("caption", caption)

          body.extend(("--" + boundary + "\r\n").encode())
          body.extend((
              'Content-Disposition: form-data; name="photo"; '
              'filename="product.' + extension + '"\r\n'
          ).encode())
          body.extend(("Content-Type: " + content_type + "\r\n\r\n").encode())
          body.extend(image_bytes)
          body.extend(b"\r\n")
          body.extend(("--" + boundary + "--\r\n").encode())

          api_url = (
              "https://api.telegram.org/bot" + TOKEN + "/sendPhoto"
          )
          request = urllib.request.Request(
              api_url,
              data=bytes(body),
              headers={
                  "Content-Type": "multipart/form-data; boundary=" + boundary
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              print("Telegram HTTP status:", error.code)
              print("Telegram response:", details[:1000])
              raise SystemExit("ERROR: Telegram photo upload failed.")

          if not result.get("ok"):
              print("Telegram API rejected the request.")
              raise SystemExit("ERROR: Telegram did not confirm the send.")

          message = result.get("result", {})
          returned_chat = str(message.get("chat", {}).get("id", ""))
          message_id = message.get("message_id")

          if (
              returned_chat != CHAT_ID
              or not message_id
              or not message.get("photo")
          ):
              raise SystemExit(
                  "ERROR: Telegram response did not confirm the expected photo."
              )

          print("SUCCESS: Product photo and details sent to Telegram.")
          print("Telegram message ID:", message_id)
          PY
