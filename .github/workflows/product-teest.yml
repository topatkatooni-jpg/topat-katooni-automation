
name: Topat Katooni Product Test

on:
  workflow_dispatch:

jobs:
  product-test:
    runs-on: ubuntu-latest
    steps:
      - name: Discover products, extract details and send one to Telegram
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import html
          import urllib.request
          import urllib.parse
          import urllib.error
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation

          BASE = "https://topatkatooni.ir"
          SITEMAP = BASE + "/wp-sitemap.xml"
          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"].strip()

          if not TOKEN or not CHAT_ID:
              raise SystemExit("ERROR: Telegram secrets are missing.")

          def fetch(url, timeout=30):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def text_fetch(url):
              return fetch(url).decode("utf-8", errors="replace")

          print("Step 1: Reading WordPress sitemap.")
          xml_text = text_fetch(SITEMAP)
          root = ET.fromstring(xml_text)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          sitemap_urls = [
              item.text.strip()
              for item in root.findall(".//sm:sitemap/sm:loc", ns)
              if item.text
          ]

          product_maps = [
              url for url in sitemap_urls
              if "product" in url.lower()
          ]

          product_urls = []

          if product_maps:
              for map_url in product_maps:
                  try:
                      map_root = ET.fromstring(text_fetch(map_url))
                      for item in map_root.findall(".//sm:url/sm:loc", ns):
                          if item.text:
                              product_urls.append(item.text.strip())
                  except Exception as exc:
                      print("Could not read one sitemap:", type(exc).__name__)
          else:
              for item in root.findall(".//sm:url/sm:loc", ns):
                  if item.text:
                      product_urls.append(item.text.strip())

          product_urls = list(dict.fromkeys(product_urls))
          product_urls = [
              url for url in product_urls
              if urllib.parse.urlparse(url).netloc.lower()
              == urllib.parse.urlparse(BASE).netloc.lower()
          ]

          print("Product sitemap files:", len(product_maps))
          print("Product URLs discovered:", len(product_urls))

          if not product_urls:
              raise SystemExit(
                  "ERROR: No product URLs found in the WordPress sitemap."
              )

          # This test sends only one product to avoid flooding Telegram.
          product_url = product_urls[0]
          print("Selected product URL:", product_url)

          print("Step 2: Reading product page.")
          page = text_fetch(product_url)

          def get_meta(prop):
              patterns = [
                  r'<meta[^>]+property=["\']' + re.escape(prop) +
                  r'["\'][^>]+content=["\']([^"\']*)',
                  r'<meta[^>]+content=["\']([^"\']*)' +
                  r'["\'][^>]+property=["\']' + re.escape(prop) + r'["\']'
              ]
              for pattern in patterns:
                  match = re.search(pattern, page, re.I)
                  if match:
                      return html.unescape(match.group(1)).strip()
              return None

          def find_products(obj):
              if isinstance(obj, dict):
                  typ = obj.get("@type", [])
                  if isinstance(typ, str):
                      typ = [typ]
                  if "Product" in typ:
                      yield obj
                  for value in obj.values():
                      yield from find_products(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from find_products(value)

          structured_products = []
          for match in re.finditer(
              r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
              page, re.I | re.S
          ):
              try:
                  structured_products.extend(
                      find_products(json.loads(match.group(1)))
                  )
              except (json.JSONDecodeError, TypeError):
                  pass

          product = structured_products[0] if structured_products else {}

          title = (
              product.get("name")
              or get_meta("og:title")
              or "محصول توپات کتونی"
          )

          description = (
              product.get("description")
              or get_meta("og:description")
              or "برای مشاهده جزئیات به صفحه محصول مراجعه کنید."
          )
          description = re.sub(r"\s+", " ", html.unescape(description)).strip()
          description = re.sub(r"<[^>]+>", "", description)

          image = product.get("image") or get_meta("og:image")
          if isinstance(image, list):
              image = image[0] if image else None
          if isinstance(image, dict):
              image = image.get("url") or image.get("contentUrl")
          if image:
              image = urllib.parse.urljoin(product_url, image)

          offers = product.get("offers", {})
          if isinstance(offers, list):
              offers = offers[0] if offers else {}
          price_value = offers.get("price") if isinstance(offers, dict) else None
          currency = offers.get("priceCurrency", "IRR") if isinstance(offers, dict) else "IRR"

          price = None
          if price_value is not None:
              try:
                  price = Decimal(str(price_value))
              except InvalidOperation:
                  pass

          # Fallback: common WooCommerce price markup.
          if price is None:
              price_patterns = [
                  r'<meta[^>]+property=["\']product:price:amount["\'][^>]+content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']product:price:amount["\']',
                  r'<p[^>]*class=["\'][^"\']*price[^"\']*["\'][^>]*>.*?'
                  r'(?:(?:data-price|amount)["\']?[^>]*>)?'
                  r'\s*([\d,٬٫.]+)'
              ]
              for pattern in price_patterns:
                  match = re.search(pattern, page, re.I | re.S)
                  if match:
                      raw = match.group(1).replace(",", "").replace("٬", "").strip()
                      try:
                          price = Decimal(raw)
                          break
                      except InvalidOperation:
                          pass

          print("Product title:", title)
          print("Price found:", price is not None)
          print("Image found:", bool(image))

          if price is not None:
              installment = price / Decimal("4")
              print("Price currency:", currency)
              print("Product price:", price)
              print("Each of 4 installments:", installment)
          else:
              installment = None
              print("WARNING: Price was not reliably extracted.")

          if not image:
              raise SystemExit("ERROR: Product image was not found.")

          print("Step 3: Downloading product image.")
          image_bytes = fetch(image, timeout=60)
          if not image_bytes:
              raise SystemExit("ERROR: Product image download was empty.")

          if len(image_bytes) > 10 * 1024 * 1024:
              raise SystemExit("ERROR: Image exceeds Telegram photo limit.")

          caption_parts = [title]
          if price is not None:
              caption_parts.append("قیمت محصول: " + str(price) + " " + currency)
              caption_parts.append(
                  "هر قسط از ۴ قسط: " + str(installment) + " " + currency
              )
          else:
              caption_parts.append("قیمت را در صفحه محصول بررسی کنید.")
          caption_parts.append(description[:500])
          caption_parts.append(product_url)
          caption = "\n\n".join(caption_parts)[:1000]

          print("Step 4: Uploading photo to configured Telegram Chat ID.")
          boundary = "----TopatKatooniBoundary"
          body = bytearray()

          def add_field(name, value):
              body.extend(("--" + boundary + "\r\n").encode())
              body.extend((
                  'Content-Disposition: form-data; name="' +
                  name + '"\r\n\r\n'
              ).encode())
              body.extend(str(value).encode("utf-8"))
              body.extend(b"\r\n")

          add_field("chat_id", CHAT_ID)
          add_field("caption", caption)

          body.extend(("--" + boundary + "\r\n").encode())
          body.extend(
              b'Content-Disposition: form-data; name="photo"; filename="product.jpg"\r\n'
          )
          body.extend(b"Content-Type: image/jpeg\r\n\r\n")
          body.extend(image_bytes)
          body.extend(b"\r\n")
          body.extend(("--" + boundary + "--\r\n").encode())

          api = "https://api.telegram.org/bot" + TOKEN + "/sendPhoto"
          request = urllib.request.Request(
              api,
              data=bytes(body),
              headers={
                  "Content-Type": "multipart/form-data; boundary=" + boundary
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              details = exc.read().decode("utf-8", errors="replace")
              print("Telegram HTTP status:", exc.code)
              print("Telegram response:", details[:1000])
              raise SystemExit("ERROR: Telegram photo upload failed.")

          if not result.get("ok"):
              print("Telegram rejected request.")
              raise SystemExit("ERROR: Telegram did not confirm photo send.")

          message = result.get("result", {})
          returned_chat = str(message.get("chat", {}).get("id", ""))
          message_id = message.get("message_id")

          if returned_chat != CHAT_ID or not message_id or not message.get("photo"):
              raise SystemExit("ERROR: Telegram response was not as expected.")

          print("SUCCESS: One product photo and caption sent to Telegram.")
          print("Telegram message ID:", message_id)
          print("Installment calculation completed when price was available.")
          PY
