
name: Topat Katooni Product Test

on:
  workflow_dispatch:

jobs:
  product-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check product page
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import re
          import html

          url = os.environ["PRODUCT_URL"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8", errors="replace")

          def get_meta(prop):
              pattern = (
                  r'<meta[^>]+property=["\']'
                  + re.escape(prop)
                  + r'["\'][^>]+content=["\']([^"\']*)'
              )
              match = re.search(pattern, page, re.I)
              if not match:
                  pattern = (
                      r'<meta[^>]+content=["\']([^"\']*)'
                      r'["\'][^>]+property=["\']'
                      + re.escape(prop) + r'["\']'
                  )
                  match = re.search(pattern, page, re.I)
              return html.unescape(match.group(1)) if match else None

          title = get_meta("og:title") or "عنوان محصول پیدا نشد"
          image = get_meta("og:image")

          print("Product page opened successfully")
          print("Product title:", title)
          print("Product image found:", bool(image))
          print("Product URL:", url)
          PY
