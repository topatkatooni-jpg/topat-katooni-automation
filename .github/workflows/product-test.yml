
name: Topat Katooni Product Test

on:
  workflow_dispatch:

jobs:
  product-test:
    runs-on: ubuntu-latest
    steps:
      - name: Read product and send image to Telegram
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import html
          import json
          import urllib.request
          import urllib.parse

          url = os.environ["PRODUCT_URL"]
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          if not url or not token or not chat_id:
              raise SystemExit("ERROR: Missing GitHub Secret")

          req = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", errors="replace")

          def get_meta(prop):
              patterns = [
                  r'<meta[^>]+property=["\']' + re.escape(prop) +
                  r'["\'][^>]+content=["\']([^"\']*)',
                  r'<meta[^>]+content=["\']([^"\']*)' +
                  r'["\'][^>]+property=["\']' + re.escape(prop) + r'["\']'
              ]
              for pattern in patterns:
                  match = re.search(pattern, page, re.I)
                  if match:
                      return html.unescape(match.group(1))
              return None

          title = get_meta("og:title") or "محصول توپات کتونی"
          image = get_meta("og:image")

          print("Product title:", title)
          print("Product image found:", bool(image))

          if not image:
              raise SystemExit("ERROR: Product image not found")

          image = urllib.parse.urljoin(url, image)
          api = "https://api.telegram.org/bot" + token + "/sendPhoto"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "photo": image,
              "caption": title[:900] + "\n" + url
          }).encode()

          req = urllib.request.Request(api, data=data)
          with urllib.request.urlopen(req, timeout=60) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise SystemExit("ERROR: Telegram rejected the photo")

          print("SUCCESS: Product photo sent to Telegram")
          PY
