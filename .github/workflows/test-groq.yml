
name: Test Groq API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Groq connection
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python test_groq.py
